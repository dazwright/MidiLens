<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background squircle gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e2230" />
      <stop offset="50%" stop-color="#141722" />
      <stop offset="100%" stop-color="#0b0d14" />
    </linearGradient>

    <!-- Bevel ring gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.7" />
      <stop offset="40%" stop-color="#818cf8" stop-opacity="0.3" />
      <stop offset="80%" stop-color="#f59e0b" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#0ea5e9" stop-opacity="0.8" />
    </linearGradient>

    <!-- Lens Glass Gradient -->
    <linearGradient id="lensGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35" />
      <stop offset="40%" stop-color="#0284c7" stop-opacity="0.15" />
      <stop offset="70%" stop-color="#1e1b4b" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.25" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base Frame -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="4" />

  <!-- Piano Roll Grid Lines Behind Lens -->
  <g opacity="0.22" stroke="#475569" stroke-width="1.5">
    <line x1="80" y1="120" x2="432" y2="120" />
    <line x1="80" y1="168" x2="432" y2="168" />
    <line x1="80" y1="216" x2="432" y2="216" stroke="#64748b" stroke-width="2.2" />
    <line x1="80" y1="264" x2="432" y2="264" />
    <line x1="80" y1="312" x2="432" y2="312" />
    <line x1="80" y1="360" x2="432" y2="360" stroke="#64748b" stroke-width="2.2" />

    <!-- Bar vertical grid lines -->
    <line x1="140" y1="90" x2="140" y2="410" />
    <line x1="210" y1="90" x2="210" y2="410" stroke="#94a3b8" stroke-width="2.2" />
    <line x1="280" y1="90" x2="280" y2="410" />
    <line x1="350" y1="90" x2="350" y2="410" stroke="#94a3b8" stroke-width="2.2" />
  </g>

  <!-- Glowing MIDI Note Blocks (Soft Light Green -> Amber -> Vivid Red Velocity Heatmap) -->
  <!-- Note 1: Soft Green (low vel) -->
  <rect x="100" y="324" width="76" height="26" rx="6" fill="#4ade80" filter="url(#neonGlow)" />
  <rect x="100" y="324" width="76" height="26" rx="6" fill="#86efac" stroke="#22c55e" stroke-width="2" />
  <rect x="104" y="327" width="68" height="3" rx="1.5" fill="#ffffff" opacity="0.6" />

  <!-- Note 2: Emerald Green -->
  <rect x="160" y="276" width="64" height="26" rx="6" fill="#34d399" filter="url(#neonGlow)" />
  <rect x="160" y="276" width="64" height="26" rx="6" fill="#6ee7b7" stroke="#10b981" stroke-width="2" />
  <rect x="164" y="279" width="56" height="3" rx="1.5" fill="#ffffff" opacity="0.6" />

  <!-- Note 3: Warm Amber (mid vel) -->
  <rect x="210" y="228" width="92" height="26" rx="6" fill="#fbbf24" filter="url(#neonGlow)" />
  <rect x="210" y="228" width="92" height="26" rx="6" fill="#fde047" stroke="#f59e0b" stroke-width="2" />
  <rect x="214" y="231" width="84" height="3" rx="1.5" fill="#ffffff" opacity="0.7" />

  <!-- Note 4: Orange-Red (high vel) -->
  <rect x="290" y="180" width="70" height="26" rx="6" fill="#f97316" filter="url(#neonGlow)" />
  <rect x="290" y="180" width="70" height="26" rx="6" fill="#fdba74" stroke="#ea580c" stroke-width="2" />
  <rect x="294" y="183" width="62" height="3" rx="1.5" fill="#ffffff" opacity="0.7" />

  <!-- Note 5: Crimson Red (max vel 127) -->
  <rect x="345" y="132" width="80" height="26" rx="6" fill="#ef4444" filter="url(#neonGlow)" />
  <rect x="345" y="132" width="80" height="26" rx="6" fill="#fca5a5" stroke="#dc2626" stroke-width="2" />
  <rect x="349" y="135" width="72" height="3" rx="1.5" fill="#ffffff" opacity="0.8" />

  <!-- Lower Bass Root Note -->
  <rect x="120" y="372" width="110" height="26" rx="6" fill="#38bdf8" filter="url(#neonGlow)" />
  <rect x="120" y="372" width="110" height="26" rx="6" fill="#7dd3fc" stroke="#0284c7" stroke-width="2" />

  <!-- Central Precision "Lens" / Aperture Graphic -->
  <!-- Outer glowing rings -->
  <circle cx="256" cy="256" r="136" fill="url(#lensGrad)" stroke="#38bdf8" stroke-width="4.5" filter="url(#softGlow)" opacity="0.6" />
  <circle cx="256" cy="256" r="136" fill="none" stroke="#e0f2fe" stroke-width="2.5" />
  <circle cx="256" cy="256" r="122" fill="none" stroke="#0284c7" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.85" />
  <circle cx="256" cy="256" r="108" fill="none" stroke="#f59e0b" stroke-width="2" opacity="0.6" />

  <!-- Glass Specular Reflection Crescent -->
  <path d="M 160 180 A 130 130 0 0 1 330 145 A 118 118 0 0 0 180 230 Z" fill="#ffffff" opacity="0.22" />

  <!-- Crosshairs / Reticle Precision Indicators -->
  <line x1="256" y1="126" x2="256" y2="148" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />
  <line x1="256" y1="364" x2="256" y2="386" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />
  <line x1="126" y1="256" x2="148" y2="256" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />
  <line x1="364" y1="256" x2="386" y2="256" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />

  <!-- Lens Center Focus Ring with Musical Octave / Aperture blades -->
  <circle cx="256" cy="256" r="38" fill="#0f172a" stroke="#38bdf8" stroke-width="3" />
  <circle cx="256" cy="256" r="18" fill="#f59e0b" filter="url(#neonGlow)" />
  <circle cx="256" cy="256" r="18" fill="#fef08a" stroke="#d97706" stroke-width="2" />
  <circle cx="256" cy="256" r="6" fill="#ffffff" />

  <!-- Brand Label Badge on Bottom -->
  <rect x="176" y="420" width="160" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" opacity="0.95" />
  <text x="256" y="441" font-family="'JetBrains Mono', 'Plus Jakarta Sans', monospace, sans-serif" font-weight="800" font-size="14" fill="#38bdf8" text-anchor="middle" letter-spacing="3.5">MIDILENS</text>
</svg>
