name: Build macOS .pkg Installer

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  workflow_dispatch:

jobs:
  build-macos-pkg:
    name: Build MidiLens Universal (.pkg)
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js (if full repo)
        if: hashFiles('package.json') != ''
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install web dependencies & bundle JUCE WebUI
        if: hashFiles('package.json') != ''
        run: |
          npm install --legacy-peer-deps --no-audit --no-fund
          node scripts/build-juce-webui.mjs

      - name: Configure CMake (Universal arm64 + x86_64)
        run: |
          if [ -f "juce_source/CMakeLists.txt" ]; then
            SRC_DIR="juce_source"
          else
            SRC_DIR="."
          fi
          cmake -S "$SRC_DIR" -B build -G Xcode \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET="11.0"

      - name: Compile AU, VST3 & Standalone
        run: |
          cmake --build build --config Release \
            --target MidiPreviewer_AU MidiPreviewer_VST3 MidiPreviewer_Standalone

      - name: Setup Apple Developer Signing Keychain (if secrets configured)
        id: apple_signing
        env:
          APPLE_CERT_P12_BASE64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
        run: |
          if [ -z "$APPLE_CERT_P12_BASE64" ] || [ -z "$APPLE_CERT_PASSWORD" ]; then
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "Apple Developer certificate secrets not set; using ad-hoc signing."
            exit 0
          fi

          KEYCHAIN_PATH="$RUNNER_TEMP/midilens-signing.keychain-db"
          KEYCHAIN_PASS="$(openssl rand -hex 24)"
          CERT_PATH="$RUNNER_TEMP/dev_certs.p12"

          echo "$APPLE_CERT_P12_BASE64" | base64 --decode > "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 3600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')

          security import "$CERT_PATH" \
            -k "$KEYCHAIN_PATH" \
            -P "$APPLE_CERT_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/productbuild \
            -T /usr/bin/pkgbuild
          rm -f "$CERT_PATH"

          curl -fsSL -o "$RUNNER_TEMP/DeveloperIDG2CA.cer" https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer
          security import "$RUNNER_TEMP/DeveloperIDG2CA.cer" -k "$KEYCHAIN_PATH" || true
          rm -f "$RUNNER_TEMP/DeveloperIDG2CA.cer"

          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"

          DEV_ID_APP=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep "Developer ID Application" | head -n 1 | sed -E 's/.*"([^"]+)".*/\1/' || true)
          DEV_ID_INST=$(security find-identity -v "$KEYCHAIN_PATH" | grep "Developer ID Installer" | head -n 1 | sed -E 's/.*"([^"]+)".*/\1/' || true)

          if [ -z "$DEV_ID_APP" ] || [ -z "$DEV_ID_INST" ]; then
            echo "::error::Could not find both 'Developer ID Application' and 'Developer ID Installer' certificates in APPLE_CERT_P12_BASE64."
            exit 1
          fi

          echo "signed=true" >> "$GITHUB_OUTPUT"
          echo "dev_id_app=$DEV_ID_APP" >> "$GITHUB_OUTPUT"
          echo "dev_id_inst=$DEV_ID_INST" >> "$GITHUB_OUTPUT"
          echo "keychain_path=$KEYCHAIN_PATH" >> "$GITHUB_OUTPUT"

      - name: Code Sign Plugin Bundles
        run: |
          if [ "${{ steps.apple_signing.outputs.signed }}" = "true" ]; then
            SIGN_ID="${{ steps.apple_signing.outputs.dev_id_app }}"
            for BUNDLE in \
              "build/MidiPreviewer_artefacts/Release/AU/MidiLens.component" \
              "build/MidiPreviewer_artefacts/Release/VST3/MidiLens.vst3" \
              "build/MidiPreviewer_artefacts/Release/Standalone/MidiLens.app"; do
              codesign --force --deep --options runtime --timestamp --sign "$SIGN_ID" "$BUNDLE"
              codesign --verify --deep --strict "$BUNDLE"
            done
          else
            codesign --force --deep --sign - "build/MidiPreviewer_artefacts/Release/AU/MidiLens.component"
            codesign --force --deep --sign - "build/MidiPreviewer_artefacts/Release/VST3/MidiLens.vst3"
            codesign --force --deep --sign - "build/MidiPreviewer_artefacts/Release/Standalone/MidiLens.app"
          fi

      - name: Create postinstall script & Package safe .pkg Installer
        run: |
          mkdir -p pkg_scripts
          printf '%s\n' '#!/bin/bash' 'killall -9 AudioComponentRegistrar AUHostingServiceXPC AUHostingServiceXPC_arrow 2>/dev/null || true' 'exit 0' > pkg_scripts/postinstall
          chmod +x pkg_scripts/postinstall

          mkdir -p stage_au stage_vst3 stage_app pkgs
          cp -R "build/MidiPreviewer_artefacts/Release/AU/MidiLens.component" stage_au/
          cp -R "build/MidiPreviewer_artefacts/Release/VST3/MidiLens.vst3" stage_vst3/
          cp -R "build/MidiPreviewer_artefacts/Release/Standalone/MidiLens.app" stage_app/

          disable_relocation() {
            python3 -c 'import plistlib, sys; p = sys.argv[1]; f = open(p, "rb"); data = plistlib.load(f); f.close(); [item.__setitem__("BundleIsRelocatable", False) for item in data]; f = open(p, "wb"); plistlib.dump(data, f); f.close()' "$1"
          }

          pkgbuild --analyze --root stage_au au.plist
          disable_relocation au.plist
          pkgbuild \
            --root stage_au \
            --component-plist au.plist \
            --scripts pkg_scripts \
            --identifier com.dazcorp.midilens.au.pkg \
            --version 1.0.0 \
            --install-location "/Library/Audio/Plug-Ins/Components" \
            pkgs/MidiLens-AU.pkg

          pkgbuild --analyze --root stage_vst3 vst3.plist
          disable_relocation vst3.plist
          pkgbuild \
            --root stage_vst3 \
            --component-plist vst3.plist \
            --identifier com.dazcorp.midilens.vst3.pkg \
            --version 1.0.0 \
            --install-location "/Library/Audio/Plug-Ins/VST3" \
            pkgs/MidiLens-VST3.pkg

          pkgbuild --analyze --root stage_app app.plist
          disable_relocation app.plist
          pkgbuild \
            --root stage_app \
            --component-plist app.plist \
            --identifier com.dazcorp.midilens.app.pkg \
            --version 1.0.0 \
            --install-location "/Applications" \
            pkgs/MidiLens-App.pkg

          (cd pkgs && productbuild --synthesize \
            --package MidiLens-AU.pkg \
            --package MidiLens-VST3.pkg \
            --package MidiLens-App.pkg \
            ../distribution.xml)

          if [ "${{ steps.apple_signing.outputs.signed }}" = "true" ]; then
            productbuild \
              --distribution distribution.xml \
              --package-path pkgs \
              --sign "${{ steps.apple_signing.outputs.dev_id_inst }}" \
              --timestamp \
              MidiLens-macOS-Universal.pkg
          else
            productbuild \
              --distribution distribution.xml \
              --package-path pkgs \
              MidiLens-macOS-Universal.pkg
          fi

      - name: Notarize & Staple .pkg Installer (if Apple credentials configured)
        if: steps.apple_signing.outputs.signed == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$APPLE_ID" ] || [ -z "$APPLE_APP_SPECIFIC_PASSWORD" ] || [ -z "$APPLE_TEAM_ID" ]; then
            echo "Skipping notarization: APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, or APPLE_TEAM_ID not set."
            exit 0
          fi

          xcrun notarytool submit MidiLens-macOS-Universal.pkg \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait

          xcrun stapler staple MidiLens-macOS-Universal.pkg
          xcrun stapler validate MidiLens-macOS-Universal.pkg

      - name: Clean up temporary signing keychain
        if: always() && steps.apple_signing.outputs.keychain_path != ''
        run: |
          security delete-keychain "${{ steps.apple_signing.outputs.keychain_path }}" 2>/dev/null || true

      - name: Upload .pkg Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MidiLens-macOS-Installer
          path: MidiLens-macOS-Universal.pkg
