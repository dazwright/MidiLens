name: Build & Package MidiLens (macOS & Windows)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-macos:
    name: Build macOS Universal (AU & VST3 + Installer)
    runs-on: macos-15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Ensure CMake is available
        run: |
          command -v cmake >/dev/null 2>&1 || brew install cmake

      - name: Configure CMake (Universal arm64 + x86_64)
        run: |
          cmake -B build -G Xcode \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET="11.0"

      - name: Compile AU, VST3 & Standalone
        run: |
          cmake --build build --config Release --target MidiPreviewer_AU MidiPreviewer_VST3 MidiPreviewer_Standalone

      - name: Ad-Hoc Sign Binaries
        run: |
          codesign --force --deep --sign - "build/MidiPreviewer_artefacts/Release/AU/MidiLens.component"
          codesign --force --deep --sign - "build/MidiPreviewer_artefacts/Release/VST3/MidiLens.vst3"
          codesign --force --deep --sign - "build/MidiPreviewer_artefacts/Release/Standalone/MidiLens.app"

      - name: Build safe macOS .pkg Installer
        run: |
          mkdir -p pkg_scripts
          printf '%s\n' '#!/bin/bash' 'killall -9 AudioComponentRegistrar AUHostingServiceXPC AUHostingServiceXPC_arrow 2>/dev/null || true' 'exit 0' > pkg_scripts/postinstall
          chmod +x pkg_scripts/postinstall

          mkdir -p stage_au stage_vst3 stage_app pkgs
          cp -R "build/MidiPreviewer_artefacts/Release/AU/MidiLens.component" stage_au/
          cp -R "build/MidiPreviewer_artefacts/Release/VST3/MidiLens.vst3" stage_vst3/
          cp -R "build/MidiPreviewer_artefacts/Release/Standalone/MidiLens.app" stage_app/

          disable_relocation() {
            python3 -c 'import plistlib, sys; p = sys.argv[1]; f = open(p, "rb"); data = plistlib.load(f); f.close(); [item.__setitem__("BundleIsRelocatable", False) for item in data]; f = open(p, "wb"); plistlib.dump(data, f); f.close()' "$1"
          }

          pkgbuild --analyze --root stage_au au.plist
          disable_relocation au.plist
          pkgbuild --root stage_au --component-plist au.plist --scripts pkg_scripts \
                   --identifier com.dazcorp.midilens.au.pkg --version 1.0.0 \
                   --install-location "/Library/Audio/Plug-Ins/Components" \
                   pkgs/MidiLens-AU.pkg

          pkgbuild --analyze --root stage_vst3 vst3.plist
          disable_relocation vst3.plist
          pkgbuild --root stage_vst3 --component-plist vst3.plist \
                   --identifier com.dazcorp.midilens.vst3.pkg --version 1.0.0 \
                   --install-location "/Library/Audio/Plug-Ins/VST3" \
                   pkgs/MidiLens-VST3.pkg

          pkgbuild --analyze --root stage_app app.plist
          disable_relocation app.plist
          pkgbuild --root stage_app --component-plist app.plist \
                   --identifier com.dazcorp.midilens.app.pkg --version 1.0.0 \
                   --install-location "/Applications" \
                   pkgs/MidiLens-App.pkg

          (cd pkgs && productbuild --synthesize \
            --package MidiLens-AU.pkg \
            --package MidiLens-VST3.pkg \
            --package MidiLens-App.pkg \
            ../distribution.xml)

          productbuild --distribution distribution.xml --package-path pkgs MidiLens-macOS-Universal.pkg

      - name: Upload macOS Installer (.pkg)
        uses: actions/upload-artifact@v4
        with:
          name: MidiLens-macOS-Installer
          path: MidiLens-macOS-Universal.pkg

      - name: Upload macOS AU Component (.component)
        uses: actions/upload-artifact@v4
        with:
          name: MidiLens-AU-Component
          path: build/MidiPreviewer_artefacts/Release/AU/MidiLens.component

      - name: Upload macOS VST3 (.vst3)
        uses: actions/upload-artifact@v4
        with:
          name: MidiLens-macOS-VST3
          path: build/MidiPreviewer_artefacts/Release/VST3/MidiLens.vst3

  build-windows:
    name: Build Windows x64 (VST3 + Standalone)
    runs-on: windows-2022
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Install Microsoft.Web.WebView2 NuGet Package
        shell: pwsh
        run: |
          $wv2Dir = "${{ github.workspace }}/_deps/Nuget"
          New-Item -ItemType Directory -Force -Path $wv2Dir | Out-Null
          nuget install Microsoft.Web.WebView2 -OutputDirectory $wv2Dir

      - name: Configure CMake (Visual Studio 2022 x64)
        shell: pwsh
        run: |
          cmake -B build -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_BUILD_TYPE=Release `
            -DJUCE_WEBVIEW2_PACKAGE_LOCATION="${{ github.workspace }}/_deps/Nuget"

      - name: Compile VST3 & Standalone
        run: |
          cmake --build build --config Release --target MidiPreviewer_VST3 MidiPreviewer_Standalone

      - name: Package VST3 ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path "build\MidiPreviewer_artefacts\Release\VST3\MidiLens.vst3" -DestinationPath "MidiLens-Windows-VST3.zip"

      - name: Upload Windows VST3
        uses: actions/upload-artifact@v4
        with:
          name: MidiLens-Windows-VST3
          path: MidiLens-Windows-VST3.zip
